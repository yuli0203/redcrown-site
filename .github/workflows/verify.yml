# The pre-push hook only runs for a clone that opted in with
# `git config core.hooksPath .githooks`, and it lets the push through when
# Python or Playwright is missing. This runs the same checks where nobody
# can skip them.

name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  language-pages:
    name: Language pages are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tools/test_microsoft_auth.cjs
      # Payment API: signed links, checkout, webhook verification, idempotency.
      - run: node --test workers/pay/test/pay.test.js
      # Public repository: fail if a payment secret or private key is committed.
      - run: node tools/check_no_secrets.mjs
      # Payment pages must reference the current CSS/JS (no stale cached copies).
      - run: node tools/stamp_pay_assets.mjs --check
      - run: node --test tools/test_contact_form.js
      - run: node --test tools/test_contact_form.js
        env:
          CONTACT_SCRIPT: he/vr-development/vr-landing.js
      - run: node tools/test_vr_fallback.cjs
      - run: python tools/test_campaign_pages.py
      - run: python tools/build_he_landing_pages.py --check
      # Fails if a translation key is missing, if alt/aria text was left in
      # English, if a path would 404 one directory down, or if the committed
      # page no longer matches a fresh render of index.html + site.js.
      - run: node tools/build_lang_page.js ru --check
      # Fails if any service/case-study page differs from a fresh render of
      # tools/pages.data.js, so edited content cannot ship half-applied.
      - run: node tools/build_pages.js --check

  campaign-device-matrix:
    name: Campaign pages work on mobile and desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium webkit
      - run: python tools/verify_no_break.py --campaigns-only

  device-matrix:
    name: No elements break across devices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium webkit
      # Real WebKit and Chromium across the mobile matrix: horizontal overflow,
      # a clipped hero, images that fail to load, sub-16px inputs, sections left
      # invisible, and console errors. Exits non-zero on any of them.
      - run: python tools/verify_no_break.py
      # Design, functionality and responsivity of the standalone pages:
      # link integrity, prev/next loop, 7 viewports, tap targets, schema.
      - run: python tools/test_pages.py
      # The 3D cards are the one part CSS checks cannot judge: this drives a
      # real browser and asserts each card builds, loads and zooms.
      - run: python tools/test_models.py
