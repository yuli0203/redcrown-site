# Red Crown payment API and document generator. Public repository: no secrets
# in this file. Secrets are set once with `npx wrangler secret put <NAME>`:
#   PAY_LINK_SECRET        32+ random characters (signs pay links)
#   ADMIN_TOKEN            32+ random characters (opens /admin)
#   GROW_USER_ID, GROW_PAGE_CODE   from Grow (sandbox first, then production)
#   GROW_PAGE_CODE_BIT, GROW_PAGE_CODE_APPLEPAY, GROW_PAGE_CODE_GOOGLEPAY  (optional,
#                          one per extra payment method Grow enables for you)
#   PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET   only with PROVIDER = "paypal"
#   OWNER_NAME             your name as registered, e.g. "Julia Pavlov / יוליה פבלוב"
#   BUSINESS_ID            your עוסק פטור number (printed on documents)
#   BUSINESS_ADDRESS       the address registered for your business with the Tax
#                          Authority (printed on documents; a secret because this
#                          repository is public and it may be your home address)
#   RESEND_API_KEY         email
#   SIGNING_KEY            only with PROVIDER = "paypal": your receipt signing key (see pay/README.md)
name = "red-crown-pay-api"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[vars]
ENVIRONMENT = "production"
# "grow": Grow's payment page, and Grow issues the receipts.
# "paypal": PayPal, with receipts issued (and signed) here.
PROVIDER = "grow"
# Sandbox until Grow approves the integration; live is
# https://secure.meshulam.co.il/api/light/server/1.0
GROW_API_URL = "https://sandbox.meshulam.co.il/api/light/server/1.0"
ALLOWED_ORIGIN = "https://redcrowninteractive.com"
SITE_URL = "https://redcrowninteractive.com"
# Sandbox until tested end to end; live is https://api-m.paypal.com
PAYPAL_API_URL = "https://api-m.sandbox.paypal.com"
# From developer.paypal.com > your app > Webhooks, after adding
# https://<worker>/webhook/paypal for PAYMENT.CAPTURE.COMPLETED. Not a secret.
PAYPAL_WEBHOOK_ID = ""
# Printed on every document.
TRADING_NAME = "Red Crown Interactive"
BUSINESS_EMAIL = "julia@redcrowninteractive.com"
BUSINESS_PHONE = "+972-77-360-9992"
# First receipt number if the series has not started (can also be set once on /admin).
RECEIPT_START = "1"
# Emails. NOTIFY_FROM must be on a domain verified in Resend.
NOTIFY_TO = "julia@redcrowninteractive.com"
NOTIFY_FROM = "Red Crown Interactive <payments@redcrowninteractive.com>"

# The signing certificate (public data; see pay/README.md).
# Create with: npx wrangler kv namespace create PAYMENTS  (then paste the id)
[[kv_namespaces]]
binding = "PAYMENTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# The ledger: payment requests, receipts, numbering (SQLite Durable Object).
[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ledger"]

# 10 checkout attempts per minute per IP.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Keeps Worker logs (every payment and email is logged) in the dashboard.
[observability]
enabled = true
