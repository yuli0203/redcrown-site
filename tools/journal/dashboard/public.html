<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E080A">
<!-- A control panel, not content: it must never compete with the blog in search. -->
<meta name="robots" content="noindex, nofollow">
<title>Journal Engine · Red Crown Interactive</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Michroma;src:url('/fonts/Michroma-Regular.woff2') format('woff2');font-display:swap}
@font-face{font-family:'IBM Plex Sans';src:url('/fonts/IBMPlexSans-var.woff2') format('woff2');font-weight:100 700;font-display:swap}
@font-face{font-family:'Chakra Petch';src:url('/fonts/ChakraPetch-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
:root{color-scheme:dark;--bg:#0e080a;--panel:#1a1013;--panel2:#120c0e;--line:rgba(240,234,228,.12);--bone:#f0eae4;--dim:#a89da0;--accent:#f03f5c;--red:#c8102e;--ok:#4ade80;--warn:#fbbf24;--plan:#7c5cff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 70% 0,rgba(118,35,47,.26),transparent 48%) var(--bg);color:var(--bone);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.7}
a{color:inherit}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{width:min(1200px,calc(100% - 48px));margin-inline:auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand strong,.brand small{display:block;font-family:'Chakra Petch',sans-serif;font-weight:600}
.brand strong{font-size:15px;letter-spacing:3px;line-height:19px}
.brand small{font-size:9px;letter-spacing:4px;line-height:14px;color:var(--accent);margin-top:2px}
.who{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--dim)}
button{font:inherit;cursor:pointer}
.btn{padding:10px 18px;border-radius:10px;border:0;background:var(--red);color:#fff;font-weight:600;min-height:42px}
.btn:hover{background:#a80d26}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--bone)}
.btn.ghost:hover{background:rgba(240,234,228,.06)}
.btn.small{padding:7px 12px;min-height:36px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* sign-in */
#gate{max-width:440px;margin:12vh auto;padding:34px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
#gate h1{font-size:26px;margin:0 0 8px}
#gate p{color:var(--dim);font-size:14px;margin:0 0 22px}
#gate label{display:block;font-size:13px;margin:14px 0 6px}
#gate input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--bone);font:inherit;font-size:16px}
#gate .btn{width:100%;margin-top:18px}
#gate-message{font-size:13px;color:var(--accent);min-height:22px;margin-top:12px}
.divider{text-align:center;color:var(--dim);font-size:12px;margin:18px 0}
/* app */
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-block:18px;border-bottom:1px solid var(--line);margin-bottom:28px}
nav.tabs button{padding:9px 16px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--dim);min-height:40px}
nav.tabs button:hover{color:var(--bone);background:rgba(240,234,228,.06)}
nav.tabs button[aria-current=true]{background:rgba(200,16,46,.2);border-color:#76232f;color:var(--bone);font-weight:600}
h1.view{font-size:clamp(26px,3.4vw,38px);margin:0 0 4px;letter-spacing:-.5px}
p.sub{color:var(--dim);margin:0 0 26px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:32px}
.card{border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--panel)}
.card .k{color:var(--dim);font-size:13px;margin-bottom:8px}
.card .v{font-size:32px;font-weight:700;line-height:1.05}
.card .n{color:var(--dim);font-size:12px;margin-top:6px}
.card .n.up{color:var(--ok)}.card .n.down{color:var(--warn)}
.spark{display:block;width:100%;height:46px;margin-top:12px;overflow:visible}
.row{border:1px solid var(--line);border-inline-start:3px solid #76232f;border-radius:14px;padding:18px 20px;margin-bottom:12px;background:var(--panel);display:block;text-decoration:none}
.row h3{margin:0 0 6px;font-size:18px}
.row p{margin:0 0 10px;color:#c5b9bd;font-size:14px}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--dim);font-size:13px}
.badge{padding:3px 10px;border-radius:999px;font-size:12px;background:rgba(74,222,128,.14);color:var(--ok)}
.badge.draft{background:rgba(251,191,36,.14);color:var(--warn)}
.badge.muted{background:rgba(240,234,228,.08);color:var(--dim)}
.badge.plan{background:rgba(124,92,255,.18);color:#bdaeff}
.badge.easy{background:rgba(74,222,128,.14);color:var(--ok)}
.badge.medium{background:rgba(251,191,36,.14);color:var(--warn)}
.badge.hard{background:rgba(240,63,92,.16);color:#ff899b}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:12px;letter-spacing:.4px}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.score{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:rgba(200,16,46,.18);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
/* content calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.cal-head strong{font-size:18px}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.weekdays{font-size:12px;color:var(--dim);text-align:center;margin-bottom:8px}
.day{min-height:104px;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--panel2);display:flex;flex-direction:column;gap:6px}
.day.other{opacity:.35}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day .n{font-size:12px;color:var(--dim)}
.chip{display:block;width:100%;text-align:start;font-size:12px;line-height:1.4;padding:7px 8px;border-radius:8px;border:1px solid transparent;background:rgba(118,35,47,.35);color:var(--bone);text-decoration:none}
.chip.planned{background:rgba(124,92,255,.16);border-color:rgba(124,92,255,.4)}
.chip.slot{background:transparent;border:1px dashed rgba(240,234,228,.18);color:var(--dim)}
.chip.slot:hover{border-color:var(--accent);color:var(--bone)}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--dim);font-size:13px;margin-top:16px}
.legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:8px;vertical-align:middle}
.legend .pub::before{background:#76232f}
.legend .pl::before{background:var(--plan)}
.legend .sl::before{border:1px dashed var(--dim)}
/* misc */
.note{border:1px solid var(--line);border-radius:16px;padding:22px;background:var(--panel);margin-bottom:20px}
.note h2{margin:0 0 10px;font-size:19px}
.note p{color:#c5b9bd;margin:0 0 12px}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel2);border:1px solid var(--line);border-radius:10px;direction:ltr;text-align:left;font-size:13px}
code{padding:2px 8px;display:inline-block}
pre{padding:16px;overflow:auto;white-space:pre-wrap;line-height:1.6}
.md{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;white-space:pre-wrap;font-size:14px;line-height:1.8}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin:0}
.dl dt{color:var(--dim);font-size:13px}
.dl dd{margin:4px 0 0;font-size:16px}
.field{margin-bottom:18px}
.field h3{margin:0 0 6px;font-size:15px;color:var(--dim);font-weight:600}
.field p{margin:0;font-size:15px;line-height:1.8}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:var(--panel2)}
.status{display:flex;align-items:center;gap:8px;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.on{background:var(--ok)}.dot.off{background:#6b5560}
.hint{color:var(--dim);font-size:13px}
.err{border:1px solid #76232f;background:#221519;border-radius:12px;padding:16px 18px;margin-bottom:18px;color:#ffb3c0}
.range{display:flex;gap:6px}
.range button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--dim);min-height:38px}
.range button[aria-pressed=true]{background:rgba(200,16,46,.2);border-color:#76232f;color:var(--bone)}
.tip{position:fixed;pointer-events:none;background:#241a1e;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;opacity:0;transition:opacity .12s;z-index:9;white-space:nowrap}
footer{border-top:1px solid var(--line);margin-top:56px;padding-block:24px;color:var(--dim);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px}
@media(max-width:820px){.wrap{width:calc(100% - 32px)}.grid2{grid-template-columns:1fr}.day{min-height:78px}.weekdays{font-size:10px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/he/" dir="ltr" aria-label="Red Crown Interactive">
      <img src="/assets/logo-kit/redcrown-primary-scarlet.svg" width="40" height="40" alt="">
      <span><strong>RED CROWN</strong><small>JOURNAL ENGINE</small></span>
    </a>
    <div class="who" id="who" hidden>
      <span id="who-email"></span>
      <button class="btn ghost small" id="signout">יציאה</button>
    </div>
  </header>

  <section id="gate">
    <h1>לוח הבקרה</h1>
    <p>התחברות עם אותו חשבון של היומן. הגישה פתוחה רק לכתובות שהוגדרו כבעלים.</p>
    <button class="btn ghost" id="google" style="width:100%">התחברות עם Google</button>
    <div class="divider">או</div>
    <form id="gate-form">
      <label for="email">אימייל</label>
      <input type="email" id="email" autocomplete="email" required>
      <label for="password">סיסמה</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button class="btn" type="submit" id="signin">התחברות</button>
    </form>
    <p id="gate-message" role="status"></p>
  </section>

  <main id="app" hidden>
    <nav class="tabs" id="tabs"></nav>
    <div id="view"></div>
  </main>

  <footer>
    <span dir="ltr">© 2026 Red Crown Interactive</span>
    <span><a href="/blog/">הבלוג</a> · <a href="/blog/feed.xml">RSS</a></span>
  </footer>
</div>
<div class="tip" id="tip"></div>

<script type="module">
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const he = iso => new Intl.DateTimeFormat('he-IL', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }).format(new Date(iso));
const dayKey = date => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
const num = value => new Intl.NumberFormat('he-IL').format(Math.round(value));

let settings = {}, auth = null, sdk = null, state = null, plan = { days: {} }, googleToken = null;
let current = 'overview', error = '';
const analytics = { range: 28, data: null, error: '', loading: false };

/* ---------- API ---------- */
async function api(path, options = {}) {
  const token = await auth.currentUser.getIdToken();
  const response = await fetch(new URL(path, settings.apiOrigin), {
    ...options,
    headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json', ...(options.headers || {}) },
  });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.error || `שגיאה ${response.status}`);
  return body;
}

/* ---------- sign-in: the same Firebase project the calendar uses ---------- */
async function boot() {
  settings = await fetch('/seo/config.json', { cache: 'no-store' }).then(r => r.json());
  const firebase = await fetch(settings.authConfig, { cache: 'no-store' }).then(r => r.json());
  const [app, authSdk] = await Promise.all([
    import('https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js'),
    import('https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js'),
  ]);
  sdk = authSdk;
  auth = authSdk.getAuth(app.initializeApp(firebase.firebase));
  authSdk.onAuthStateChanged(auth, user => { user && user.emailVerified ? signedIn(user) : signedOut(user); });

  $('gate-form').addEventListener('submit', async event => {
    event.preventDefault();
    message('מתחבר…');
    try {
      await sdk.signInWithEmailAndPassword(auth, $('email').value.trim(), $('password').value);
    } catch (failure) {
      message(failure.code === 'auth/invalid-credential' ? 'האימייל או הסיסמה שגויים.' : failure.message);
    }
    $('password').value = '';
  });
  $('google').addEventListener('click', () => signInWithGoogle(false));
  $('signout').addEventListener('click', () => sdk.signOut(auth));
}

const message = text => { $('gate-message').textContent = text; };

/* Search Console needs its own consent, so the scope is requested only when the
   analytics view asks for it - not on every sign-in. */
async function signInWithGoogle(withSearchConsole) {
  const provider = new sdk.GoogleAuthProvider();
  if (withSearchConsole) provider.addScope('https://www.googleapis.com/auth/webmasters.readonly');
  try {
    const result = await sdk.signInWithPopup(auth, provider);
    const credential = sdk.GoogleAuthProvider.credentialFromResult(result);
    if (withSearchConsole && credential?.accessToken) {
      googleToken = credential.accessToken;
      loadAnalytics();
    }
  } catch (failure) {
    if (failure.code !== 'auth/popup-closed-by-user') message(failure.message);
  }
}

function signedOut(user) {
  $('app').hidden = true; $('who').hidden = true; $('gate').hidden = false;
  if (user && !user.emailVerified) message('החשבון קיים אך המייל לא אומת. פתחו את הקישור שנשלח אליכם.');
}

async function signedIn(user) {
  $('gate').hidden = true; $('who').hidden = false; $('app').hidden = false;
  $('who-email').textContent = user.email;
  try {
    state = await api('/seo/api/state');
    error = '';
  } catch (failure) {
    error = failure.message;
  }
  try {
    plan = await api('/seo/api/plan');
  } catch { plan = { days: {} }; }
  render();
}

/* ---------- analytics: Search Console, queried straight from the browser ---------- */
const iso = date => date.toISOString().slice(0, 10);

async function searchConsole(body) {
  const property = encodeURIComponent(settings.searchConsoleProperty);
  const response = await fetch(`https://searchconsole.googleapis.com/webmasters/v3/sites/${property}/searchAnalytics/query`, {
    method: 'POST',
    headers: { authorization: `Bearer ${googleToken}`, 'content-type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (response.status === 401 || response.status === 403) throw new Error('נדרשת הרשאה ל-Search Console. התחברו שוב עם Google.');
  if (!response.ok) throw new Error(`Search Console החזיר ${response.status}. ודאו שהנכס מוגדר נכון.`);
  return response.json();
}

async function loadAnalytics() {
  if (!googleToken) return;
  analytics.loading = true; analytics.error = ''; render();
  const end = new Date(Date.now() - 2 * 86400000);   // Search Console lags ~2 days
  const start = new Date(end.getTime() - analytics.range * 86400000);
  const window = { startDate: iso(start), endDate: iso(end), searchType: 'web' };
  try {
    const [days, queries, pages] = await Promise.all([
      searchConsole({ ...window, dimensions: ['date'], rowLimit: 200 }),
      searchConsole({ ...window, dimensions: ['query'], rowLimit: 10 }),
      searchConsole({ ...window, dimensions: ['page'], rowLimit: 10 }),
    ]);
    analytics.data = { days: days.rows || [], queries: queries.rows || [], pages: pages.rows || [] };
  } catch (failure) {
    analytics.error = failure.message;
  }
  analytics.loading = false;
  render();
}

/* One metric per tile, one hue: identity comes from the tile's title, so the
   line never has to carry it. Lower is better for position, hence the flag. */
function sparkline(values, { invert = false, label = '' } = {}) {
  if (values.length < 2) return '';
  const width = 260, height = 46, pad = 3;
  const min = Math.min(...values), max = Math.max(...values);
  const span = max - min || 1;
  const x = i => pad + (i * (width - pad * 2)) / (values.length - 1);
  const y = value => {
    const t = (value - min) / span;
    return pad + (invert ? t : 1 - t) * (height - pad * 2);
  };
  const line = values.map((value, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(value).toFixed(1)}`).join(' ');
  const area = `${line} L${x(values.length - 1).toFixed(1)},${height} L${x(0).toFixed(1)},${height} Z`;
  return `<svg class="spark" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img"
      aria-label="${esc(label)}: מ-${num(values[0])} ל-${num(values.at(-1))}, טווח ${num(min)}-${num(max)}">
      <path d="${area}" fill="rgba(240,63,92,.14)"></path>
      <path d="${line}" fill="none" stroke="#f03f5c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
        vector-effect="non-scaling-stroke"></path>
      <circle cx="${x(values.length - 1).toFixed(1)}" cy="${y(values.at(-1)).toFixed(1)}" r="3" fill="#f03f5c"></circle>
    </svg>`;
}

function tile(label, value, values, { note = '', invert = false, direction = 0 } = {}) {
  const arrow = direction > 0 ? '↑' : direction < 0 ? '↓' : '';
  const tone = direction === 0 ? '' : (invert ? (direction < 0 ? 'up' : 'down') : (direction > 0 ? 'up' : 'down'));
  return `<div class="card"><div class="k">${esc(label)}</div><div class="v">${esc(value)}</div>
    <div class="n ${tone}">${arrow} ${esc(note)}</div>${sparkline(values, { invert, label })}</div>`;
}

/* ---------- views ---------- */
function overview() {
  const published = state.posts.filter(post => post.rendered).length;
  const queued = state.keywords.filter(entry => entry.status === 'queued').length;
  const shared = state.posts.filter(post => post.shared).length;
  const missingFaq = state.posts.filter(post => !post.faq).length;
  return `<h1 class="view">סקירה</h1><p class="sub">${esc(state.site.url)} · עודכן ב-${he(state.generatedAt)}</p>
  <div class="cards">
    <div class="card"><div class="k">מאמרים</div><div class="v">${state.posts.length}</div><div class="n">${published} מפורסמים</div></div>
    <div class="card"><div class="k">מילות מפתח בתור</div><div class="v">${queued}</div><div class="n">מוכנות לכתיבה</div></div>
    <div class="card"><div class="k">שותפו לפייסבוק</div><div class="v">${shared}</div><div class="n">${state.social.facebook ? 'שיתוף אוטומטי פעיל' : 'שיתוף כבוי'}</div></div>
    <div class="card"><div class="k">ללא שאלות נפוצות</div><div class="v">${missingFaq}</div><div class="n">${missingFaq ? 'חסר FAQPage' : 'כולם מכוסים'}</div></div>
  </div>
  <div class="note"><h2>לוח הזמנים</h2>
    <p>${esc(state.schedule.cronNote)} · ${state.schedule.articlesPerRun} מאמרים בכל הרצה.</p>
    <p class="hint">הכתיבה עצמה רצה ב-GitHub Actions. עריכת ההגדרות נעשית בלוח הבקרה המקומי: <code>node tools/journal/dashboard.js</code></p>
  </div>`;
}

function articles() {
  return `<h1 class="view">מאמרים</h1><p class="sub">${state.posts.length} מאמרים ב-/blog/</p>
  ${state.posts.map(post => `<a class="row" href="${esc(state.site.url)}/blog/${esc(post.slug)}/" target="_blank" rel="noopener">
    <h3>${esc(post.title)}</h3><p>${esc(post.excerpt)}</p>
    <div class="meta">
      <span class="badge ${post.rendered ? '' : 'draft'}">${post.rendered ? 'published' : 'draft'}</span>
      <span>${he(post.isoDate)}</span><span aria-hidden="true">·</span><span>${post.words} מילים</span>
      <span aria-hidden="true">·</span><span>${post.keyword ? esc(post.keyword) : 'ללא מילת מפתח'}</span>
      ${post.faq ? '' : '<span class="badge muted">ללא FAQ</span>'}
      ${post.source === 'soro-import' ? '<span class="badge muted">יובא מ-Soro</span>' : ''}
      ${post.shared ? '<span class="badge">שותף</span>' : ''}
    </div></a>`).join('')}`;
}

let calendarMonth = new Date();

function contentCalendar() {
  const cron = String(state.schedule.cron || '').split(' ');
  // Only the day-of-week field is read; the engine's schedule is a weekly one.
  const weekdays = new Set((cron[4] || '*').split(',').flatMap(part => {
    if (part === '*') return [0, 1, 2, 3, 4, 5, 6];
    if (part.includes('-')) {
      const [from, to] = part.split('-').map(Number);
      return Array.from({ length: to - from + 1 }, (_, i) => (from + i) % 7);
    }
    return [Number(part) % 7];
  }));

  const byDay = new Map();
  for (const post of state.posts) byDay.set(post.isoDate.slice(0, 10), post);

  const first = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth(), 1);
  const start = new Date(first);
  start.setDate(1 - first.getDay());
  const today = dayKey(new Date());
  const queued = state.keywords.filter(entry => entry.status === 'queued');

  const cells = Array.from({ length: 42 }, (_, index) => {
    const date = new Date(start);
    date.setDate(start.getDate() + index);
    const key = dayKey(date);
    const post = byDay.get(key);
    const planned = plan.days[key];
    const classes = ['day'];
    if (date.getMonth() !== calendarMonth.getMonth()) classes.push('other');
    if (key === today) classes.push('today');
    let body = '';
    if (post) {
      body = `<a class="chip" href="${esc(state.site.url)}/blog/${esc(post.slug)}/" target="_blank" rel="noopener">${esc(post.title)}</a>`;
    } else if (planned) {
      body = `<button class="chip planned" data-clear="${esc(key)}" title="הסרה מהלוח">${esc(planned)}</button>`;
    } else if (key >= today && weekdays.has(date.getDay())) {
      body = `<button class="chip slot" data-slot="${esc(key)}">+ שיבוץ מאמר</button>`;
    }
    return `<div class="${classes.join(' ')}"><span class="n">${date.getDate()}</span>${body}</div>`;
  }).join('');

  const monthName = new Intl.DateTimeFormat('he-IL', { month: 'long', year: 'numeric' }).format(calendarMonth);
  return `<h1 class="view">לוח תוכן</h1><p class="sub">מה כבר פורסם, ומה המנוע יכתוב בימים הקרובים.</p>
  ${queued.length ? '' : '<div class="note"><p class="hint">אין מילות מפתח בתור, אז אין מה לשבץ. הריצו מחקר בלוח הבקרה המקומי.</p></div>'}
  <div class="cal-head">
    <strong>${esc(monthName)}</strong>
    <div class="range">
      <button data-month="-1">הקודם</button><button data-month="0">היום</button><button data-month="1">הבא</button>
    </div>
  </div>
  <div class="weekdays">${['א','ב','ג','ד','ה','ו','ש'].map(day => `<span>${day}</span>`).join('')}</div>
  <div class="days">${cells}</div>
  <div class="legend"><span class="pub">פורסם</span><span class="pl">משובץ</span><span class="sl">יום פרסום פנוי</span></div>
  <p class="hint" style="margin-top:14px">שיבוץ נשמר מיד. ההרצה המתוזמנת של אותו יום כותבת את מילת המפתח המשובצת במקום את ראש התור.</p>`;
}

function ideas() {

  if (!state.keywords.length) {
    return `<h1 class="view">רעיונות</h1><p class="sub">התור ריק.</p>
      <div class="note"><p>המחקר סורק את התוצאות בגוגל, מוצא מי מדורג ואיפה הפער, ומכניס לכאן שאילתות שכדאי לכתוב עליהן.</p>
      <p class="hint">להרצה: <code>node tools/journal/research.js</code></p></div>`;
  }
  const difficulty = { low: 'easy', medium: 'medium', high: 'hard' };

function analyticsView() {
  if (!googleToken) {
    return `<h1 class="view">אנליטיקס</h1><p class="sub">נתוני החיפוש מגיעים מ-Google Search Console.</p>
    <div class="note">
      <h2>חיבור ל-Search Console</h2>
      <p>הנתונים נקראים ישירות מהדפדפן שלך מול הנכס <code>${esc(settings.searchConsoleProperty || '')}</code>.
         הם לא עוברים דרך שום שרת שלנו ולא נשמרים בשום מקום.</p>
      <button class="btn" id="connect-gsc">חיבור עם Google</button>
      <p class="hint" style="margin-top:12px">נדרשת הרשאת קריאה לנכס, והאתר צריך להיות מאומת ב-Search Console.</p>
    </div>`;
  }
  if (analytics.loading) return `<h1 class="view">אנליטיקס</h1><p class="sub">טוען נתונים…</p>`;
  if (analytics.error) return `<h1 class="view">אנליטיקס</h1><div class="err">${esc(analytics.error)}</div>
    <button class="btn ghost" id="connect-gsc">חיבור מחדש</button>`;

  const rows = analytics.data.days;
  if (!rows.length) return `<h1 class="view">אנליטיקס</h1><p class="sub">אין עדיין נתונים לתקופה הזו.</p>`;

  const clicks = rows.map(row => row.clicks);
  const impressions = rows.map(row => row.impressions);
  const ctr = rows.map(row => row.ctr * 100);
  const position = rows.map(row => row.position);
  const total = key => rows.reduce((sum, row) => sum + row[key], 0);
  const half = Math.floor(rows.length / 2);
  const trend = values => {
    const before = values.slice(0, half).reduce((a, b) => a + b, 0) / Math.max(1, half);
    const after = values.slice(half).reduce((a, b) => a + b, 0) / Math.max(1, values.length - half);
    if (!before) return 0;
    return Math.round(((after - before) / before) * 100);
  };
  const averagePosition = position.reduce((a, b) => a + b, 0) / position.length;
  const overallCtr = total('impressions') ? (total('clicks') / total('impressions')) * 100 : 0;

  return `<h1 class="view">אנליטיקס</h1>
  <p class="sub">Google Search Console · ${analytics.range} הימים האחרונים (הנתונים מתעדכנים בעיכוב של יומיים)</p>
  <div class="range" style="margin-bottom:22px">
    ${[7, 28, 90].map(days => `<button data-range="${days}" aria-pressed="${analytics.range === days}">${days} ימים</button>`).join('')}
  </div>
  <div class="cards">
    ${tile('כניסות מחיפוש', num(total('clicks')), clicks, { note: `${Math.abs(trend(clicks))}% מול התקופה הקודמת`, direction: trend(clicks) })}
    ${tile('חשיפות', num(total('impressions')), impressions, { note: `${Math.abs(trend(impressions))}% מול התקופה הקודמת`, direction: trend(impressions) })}
    ${tile('שיעור הקלקה', overallCtr.toFixed(1) + '%', ctr, { note: 'כמה מהחשיפות הפכו לכניסה', direction: trend(ctr) })}
    ${tile('מיקום ממוצע', '#' + averagePosition.toFixed(1), position, { note: 'נמוך = טוב יותר', invert: true, direction: trend(position) })}
  </div>
  <div class="grid2">
    <div><h2>שאילתות מובילות</h2>
      <table><thead><tr><th>שאילתה</th><th class="num">כניסות</th><th class="num">חשיפות</th><th class="num">מיקום</th></tr></thead>
      <tbody>${analytics.data.queries.map(row => `<tr><td>${esc(row.keys[0])}</td><td class="num">${num(row.clicks)}</td><td class="num">${num(row.impressions)}</td><td class="num">${row.position.toFixed(1)}</td></tr>`).join('') || '<tr><td>אין נתונים</td></tr>'}</tbody></table></div>
    <div><h2>עמודים מובילים</h2>
      <table><thead><tr><th>עמוד</th><th class="num">כניסות</th><th class="num">חשיפות</th></tr></thead>
      <tbody>${analytics.data.pages.map(row => `<tr><td dir="ltr">${esc(row.keys[0].replace(state.site.url, '') || '/')}</td><td class="num">${num(row.clicks)}</td><td class="num">${num(row.impressions)}</td></tr>`).join('') || '<tr><td>אין נתונים</td></tr>'}</tbody></table></div>
  </div>`;
}

const auditView = () => `<h1 class="view">אודיט SEO</h1><p class="sub">נוצר בכל הרצה מתוזמנת.</p>
  <div class="md">${esc(state.audit || 'עוד לא הורץ אודיט.')}</div>`;

const VIEWS = [
  { id: 'overview', label: 'סקירה', render: overview },
  { id: 'articles', label: 'מאמרים', render: articles },
  { id: 'calendar', label: 'לוח תוכן', render: contentCalendar },
  { id: 'ideas', label: 'רעיונות', render: ideas },
  { id: 'analytics', label: 'אנליטיקס', render: analyticsView },
  { id: 'audit', label: 'אודיט', render: auditView },
  { id: 'connect', label: 'חיבור האתר', render: connect },
  { id: 'brand', label: 'Brand DNA', render: brandDna },
];

/* ---------- plan editing ---------- */
async function savePlan(next) {
  plan = { days: next };
  render();
  try {
    await api('/seo/api/plan', { method: 'PUT', body: JSON.stringify({ days: next }) });
  } catch (failure) {
    error = failure.message;
    render();
  }
}

function nextOpenSlot() {
  const cron = String(state.schedule.cron || '').split(' ');
  const weekdays = (cron[4] || '*') === '*' ? [0, 1, 2, 3, 4, 5, 6] : (cron[4]).split(',').map(Number);
  const taken = new Set([...Object.keys(plan.days), ...state.posts.map(post => post.isoDate.slice(0, 10))]);
  for (let offset = 1; offset <= 120; offset++) {
    const date = new Date();
    date.setDate(date.getDate() + offset);
    if (weekdays.includes(date.getDay()) && !taken.has(dayKey(date))) return dayKey(date);
  }
  return null;
}

/* ---------- render ---------- */
function render() {
  $('tabs').innerHTML = VIEWS.map(view =>
    `<button data-view="${view.id}" aria-current="${current === view.id}">${view.label}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(button => {
    button.onclick = () => { current = button.dataset.view; render(); };
  });

  if (!state) {
    $('view').innerHTML = `<div class="err">${esc(error || 'טוען…')}</div>`;
    return;
  }
  const view = VIEWS.find(entry => entry.id === current);
  $('view').innerHTML = (error ? `<div class="err">${esc(error)}</div>` : '') + view.render();
  wire();
}

function wire() {
  const connectButton = $('connect-gsc');
  if (connectButton) connectButton.onclick = () => signInWithGoogle(true);

  document.querySelectorAll('[data-range]').forEach(button => {
    button.onclick = () => { analytics.range = Number(button.dataset.range); loadAnalytics(); };
  });
  document.querySelectorAll('[data-month]').forEach(button => {
    button.onclick = () => {
      const step = Number(button.dataset.month);
      calendarMonth = step === 0 ? new Date() : new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + step, 1);
      render();
    };
  });
  document.querySelectorAll('[data-slot]').forEach(button => {
    button.onclick = () => {
      const queued = state.keywords.filter(entry => entry.status === 'queued');
      if (!queued.length) return;
      const choice = prompt(`איזו מילת מפתח לשבץ ל-${button.dataset.slot}?\n\n` +
        queued.map((entry, index) => `${index + 1}. ${entry.keyword}`).join('\n'), '1');
      const entry = queued[Number(choice) - 1];
      if (entry) savePlan({ ...plan.days, [button.dataset.slot]: entry.keyword });
    };
  });
  document.querySelectorAll('[data-clear]').forEach(button => {
    button.onclick = () => {
      const days = { ...plan.days };
      delete days[button.dataset.clear];
      savePlan(days);
    };
  });
  document.querySelectorAll('[data-schedule]').forEach(button => {
    button.onclick = () => {
      const day = nextOpenSlot();
      if (!day) return;
      savePlan({ ...plan.days, [day]: button.dataset.schedule });
      current = 'calendar';
      render();
    };
  });
  const copy = $('copy-embed');
  if (copy) copy.onclick = async () => {
    await navigator.clipboard.writeText(document.querySelector('pre').textContent);
    copy.textContent = 'הועתק ✓';
  };

  // A sparkline is a chart, so it answers the pointer like one.
  document.querySelectorAll('.spark').forEach(svg => {
    const tip = $('tip');
    svg.addEventListener('pointermove', event => {
      tip.textContent = svg.getAttribute('aria-label');
      tip.style.opacity = '1';
      tip.style.insetInlineStart = `${event.clientX + 14}px`;
      tip.style.top = `${event.clientY - 34}px`;
    });
    svg.addEventListener('pointerleave', () => { tip.style.opacity = '0'; });
  });
}

boot().catch(failure => { message(`טעינה נכשלה: ${failure.message}`); });
</script>
